name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Test
        run: go test -v ./...
        
      - name: Build
        run: go build -v ./...

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Test
        working-directory: ./src
        run: cargo test --verbose
        
      - name: Build
        working-directory: ./src
        run: cargo build --release

  release:
    name: Create Release
    needs: [test-go, test-rust]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Build Go Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/sup-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/sup-darwin-amd64
          GOOS=windows GOARCH=amd64 go build -o dist/sup-windows-amd64.exe
      
      - name: Build Rust Binary
        working-directory: ./src
        run: |
          cargo build --release
          cp target/release/sup ../dist/sup-rust-linux-amd64
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/sup-linux-amd64
            dist/sup-darwin-amd64
            dist/sup-windows-amd64.exe
            dist/sup-rust-linux-amd64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 